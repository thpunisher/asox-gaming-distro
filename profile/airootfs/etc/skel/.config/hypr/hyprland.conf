# ============================================================
#  Asox Gaming Edition - Hyprland config
# ============================================================

monitor = , preferred, auto, 1

$mod      = SUPER
$terminal = kitty
$menu     = wofi --show drun

# --- Autostart ---
exec-once = swaybg -i /usr/share/backgrounds/asox/sakura-night.png -m fill
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent

# --- Environment ---
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb

# --- Virtual machine? Uncomment these lines ---
# cursor {
#     no_hardware_cursors = true
# }

# --- Input (Alt+Shift switches keyboard layout) ---
input {
    kb_layout  = us,es,fr
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- Look: sakura pastel ---
general {
    gaps_in  = 6
    gaps_out = 14
    border_size = 3
    col.active_border   = rgba(ff9ecfff) rgba(b69cffff) 45deg
    col.inactive_border = rgba(3a2a5aaa)
    layout = dwindle
}

decoration {
    rounding = 16
    inactive_opacity = 0.93

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(b69cff55)
    }
}

animations {
    enabled = true
    bezier = pop,    0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.25, 1,   0.5, 1

    animation = windows,    1, 5, pop, popin 80%
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = fade,       1, 4, smooth
    animation = border,     1, 10, smooth
    animation = workspaces, 1, 6, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# --- Keybinds ---
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, thunar
bind = $mod, B, exec, firefox
bind = $mod, S, exec, steam
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, E, exit
bind = $mod, G, exec, asox-gamemode
bind = , Print, exec, asox-screenshot

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
